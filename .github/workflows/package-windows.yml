name: Package Windows portable ZIP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'prismatic-launcher/src/qt/**'
      - 'CMakeLists.txt'
      - 'packaging/**'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Check out pinned vcpkg registry
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: e0a6b8572cf0ac716fdc11466522cf744e97e0bd
          path: build/vcpkg
      - name: Install LibArchive and its runtime dependencies
        run: |
          & ./build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & ./build/vcpkg/vcpkg.exe install libarchive:x64-windows --classic --disable-metrics --x-install-root="$env:GITHUB_WORKSPACE/build/windows-dependencies"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg installation failed' }
      - name: Configure Release with explicit SDKs
        run: |
          $deps = "$env:GITHUB_WORKSPACE/build/windows-dependencies/x64-windows"
          "$deps/bin" >> $env:GITHUB_PATH
          cmake -S . -B build/windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$deps"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build, test, deploy, verify and ZIP
        run: ./scripts/package-windows.ps1 -BuildDir build/windows-release -QtBinDir "$env:QT_ROOT_DIR/bin" -RuntimeDirectories "$env:GITHUB_WORKSPACE/build/windows-dependencies/x64-windows/bin"
      - name: Upload private workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrismaticLauncher-windows-x64
          path: |
            build/artifacts/windows/*.zip
            build/artifacts/windows/*.sha256
          if-no-files-found: error
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-diagnostics
          path: build/windows-release/Testing/Temporary/
          if-no-files-found: ignore
