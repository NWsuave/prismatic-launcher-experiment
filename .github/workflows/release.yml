name: Packaging policy validation

# Native artifact creation lives in package-macos.yml, package-linux.yml, and
# package-windows.yml. This repository does not publish releases automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate native packaging entry points
        run: |
          bash -n scripts/package-macos.sh
          bash -n scripts/package-linux.sh
          test -f scripts/package-windows.ps1
          test -f .github/workflows/package-macos.yml
          test -f .github/workflows/package-linux.yml
          test -f .github/workflows/package-windows.yml
      - name: Verify host-independent deployment safety
        run: python3 -B -m unittest discover -s packaging/macos -p 'test_*.py'
